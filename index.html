<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CountDown timer</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gradient-to-br from-pink-300 to-purple-400  flex items-centers justify-center">
    <div class="bg-gray-200 p-8  max-w-md w-full text-center rounded-2xl h-1/2 mt-40 ">
        <p class="text-2xl font-semibold text-gray-800 mb-4 font-serif">Countdown Timer</p>
        <div class="mb-4">
            <label class="mb-2 font-serif font-semibold text-green-900">Choose Target date & Time:</label>
                  <input type="datetime-local" id="targetDate" class="rounded-2xl px-4 py-2 border font-serif">
        </div>
        <button id="startBtn" class="bg-purple-400 hover:bg-purple-700 tex-white px-4 py-2 font-serif font-semibold mb-6 rounded-2xl">Start countdown</button>
        <div id="countdown" class=" text-2xl font-mono">00d 00h 00m 00s</div>
    </div>
    <script src="countdown.js"></script>
</body>
</html>
